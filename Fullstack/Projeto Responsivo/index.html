<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Dubai Abhu </title>
    <link rel="stylesheet" href="estilos/mobile.css">
    <link rel="stylesheet" href="estilos/media.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
       <main>
        <section id="login">
            <div id="imagem">
            </div>

            <div id="formulário">
             <h1>Login</h1>
             <p>Seja bem-vindo (a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
             <form action="form.php" method="post" autocomplete="on">
                
                <div class="pill">
                    <span class="material-symbols-outlined">alternate_email</span>
                    <input type="email" name="email" id="iemail" required maxlength="30" autocomplete="email" placeholder="seu e-mail">
                    <label for="iemail">Email</label>
                </div>
               
              <div class="ghost">
                  <span class="material-symbols-outlined">vpn_key</span>
                  <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" placeholder="sua senha" autocomplete="current-password">
                  <label for="isenha">Senha</label>
              </div>

              <div class="ios">
                  <input type="submit" value="Entrar">
                  <a href="">Esqueci a senha</a>
              </div>

             </form>
            </div>
           
        </section>
       </main>
</body>
</html>
