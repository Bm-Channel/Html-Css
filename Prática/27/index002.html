<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
.container {
  display: flex;
  width: 800px;
  height: 150px;
  border: 3px solid black;
}

.item {
  flex-basis: 100px; /* tamanho inicial (base) */
  border: 2px solid #333;
  background: lightgray;
  text-align: center;
  font-size: 20px;
  padding: 10px;
}

.item1 {
  flex-grow: 1;
}

.item2 {
  flex-grow: 2;
}

.item3 {
  flex-grow: 1;
}
</style>
</head>

<body>

<h2>Teste flex-grow</h2>

<div class="container">
  <div class="item item1">Grow 1</div>
  <div class="item item2">Grow 2</div>
  <div class="item item3">Grow 1</div>
</div>

</body>
</html>
