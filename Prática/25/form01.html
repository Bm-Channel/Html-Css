<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Formulário</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(162, 240, 240);
            font-size: large;
        }

        form {
            border: 5px solid black;
            padding: 20px;
            display: table;
        }

        p {
            margin: 15px;
            display: table;
            
        }
  
    </style>
</head>
<body>
    <h1>Meu Segundo Formulário</h1>
        <form action="#" method="post">

            <p><label for="bnome">Nome: </label>  
                 <input type="text" name="nome" id="bnome" placeholder="Digite seu nome" required>
            </p>
            <p><label for="bsubname">Sobrenome: </label> 
                <input type="text" name="subname" id="bsubname" placeholder="Digite seu sobrenome" required>
            </p>
            <p><label for="bemail">Email: </label> 
                <input type="email" name="email" id="bemail" placeholder="Digite seu email" required>
            </p>
            <p><label for="bsenha">Senha: </label> 
                <input type="password" name="senha" id="bsenha" placeholder="Digite sua senha" required>
            </p>
            <p>
              <input type="radio" name="groups" 
                 value="M" required > Masculino 
              <input type="radio" name="groups" 
                 value="F" required> Feminino
            </p>
            <input type="submit" value="Enviar">
        </form>
</body>
</html>
