<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            width: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 600px;
            height: 300px;
            border-collapse: collapse;
        }

        tr {
            font: normal bold 16px arial, sans-serif, cursive;
        }

        th {
             border: 1px solid black;
             padding: 10px;
             color: white;
             font: normal bolder 18px arial, sans-serif, cursive;
             
        }

        th.um{
            background-color: rgb(10, 3, 136);
        }

        th.dois {
            background-color: rgb(177, 2, 2);
        }

        th.tres {
            background-color: rgb(199, 196, 2);
        }

        th.quatro {
            background-color: rgb(3, 85, 58);
        }

        th.cinco {
            background-color: rgb(4, 212, 39);
        }
        

        td {
            border: 1px solid black;
            padding: 10px;
            background-color: rgb(218, 215, 215);
        }
        
        
    </style>
</head>
<body>
     <h1>Brincando com Tabelas :)</h1>
         <table>
            <tr>
                <th class="um">Nome</th>
                <th class="dois">Idade</th>
                <th class="tres">Começo</th>
                <th class="quatro">Nacionalidade</th>
                <th class="cinco">Fortuna</th>
            </tr>


            <tr>
                <td>Warren Buffet</td>
                <td>95 anos</td>
                <td>11 anos</td>
                <td>Estados Unidos</td>
                <td>146,5 bilhões USD</td>
            </tr>

            <tr>
                <td id>Elon Musk</td>
                <td>54 anos</td>
                <td>10 anos</td>
                <td>Estados Unidos</td>
                <td>493,2 bilhões USD</td>
            </tr>

             <tr>
                <td>Luiz Barsi</td>
                <td>86 anos</td>
                <td>14 anos</td>
                <td>Brazil</td>
                <td>US$ 19 bilhões USD</td>
            </tr>

            <tr>
                <td>Eduardo Luiz</td>
                <td>43 anos</td>
                <td>18 anos</td>
                <td>Brazil</td>
                <td>40,3 bilhões USD</td>
            </tr>


         </table>
</body>
</html>
