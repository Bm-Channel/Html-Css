<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
     <h1>Teste de Formulário</h1>
     <form action="cadastro.php" method="get" autocomplete="on">

         <p> 
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="nome completo" autocomplete="name" min="0" max="10">
         </p>

         <p>
             <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" value="2020-07" min="2019-01" max="2029-12" step="1">       
         </p>

         <p> <label for="idia">Dia da Prova</label>
              <input type="date" name="dia" id="idia" value="2020-07-05" step="1">
        </p>

        <p><label for="ihora">Horário da Prova</label>
        <input type="time" name="hora" id="ihora" step="1">
        </p>

         <p>
            <label for="imedia"> Média</label>
            <input type="number" name="media" id="imedia" step="any" value="10">
         </p> 

         
         <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
         </p>







     </form>
</body>
</html>
