<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 100rem;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center; /*Alinhamento horizontal*/
            vertical-align: middle; /*Alinhamento Vertical*/
        }

        td#siu {
            text-align: right;
            vertical-align: middle;

        }

        table.two {
            width: 400px;
            height: 250px;
            
            text-align: center;
            border-collapse: separate;
        }
        th{  width:200px ;
            height: 40px;
            border: 1px solid black;
        }

        th.um {
            background: rgb(0, 4, 255);
            color: white;
            text-transform:  uppercase;
            font: normal 800 16px sans-serif;
            padding: 5px;

        }

        th.dois {
            background-color: rgb(253, 0, 0);
            color: white;
            text-transform:  uppercase;
            font: normal 800 16px sans-serif;
            padding: 5px;
        }
        
        th.tres {
            background-color: rgb(0, 255, 34);
            color: white;
            text-transform:  uppercase;
            font: normal 800 16px sans-serif;
            padding: 5px;
        }
 
    </style>
</head>
<body>
         <h1>Minha Primeira Tabela</h1>
         <!-- 
         HIERARQUIA DE TABELAS (simples)
         TABLE = tabela 
            TABLE RON = linha de tabela
                TABLE HEADER = cabeçalho de tabela 
                TABLE DATA = dados de tabela
         -->
        <table>
          <tr> <!-- Primeira Linha-->
               <td>A1
               <td>B1
               <td id="siu">333
          </tr>

          <tr> <!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td id="siu">444</td>
          </tr>

          <tr> <!--Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td id="siu">777</td>
          </tr>

          <tr> <!--Quarta Linha-->
            <td>A4</td>
            <td>B4</td>
            <td id="siu">888</td>
          </tr>
        </table>
        
        <h1>Minha Segunda Tabela</h1>

        <table class="two">
            <tr>
                <th class="um">Nome</th>
                <th class="dois">Idade</th>
                <th class="tres">Profissão</th>
            </tr>

            <tr>
                <td>Bruno Mafra </td>
                <td>30</td>
                <td>Bilionário &#x1F4B8;</td> 
            </tr>

            <tr>
                <td>Bill Gates</td>
                <td>25</td>
                <td>Billionaire &#x1F4B8;</td>
            </tr>

            <tr>
                <td>Elon Musk</td>
                <td>30</td>
                <td>Trillionaire &#x1F4B8;</td>
            </tr>
        </table>
</body>
</html>
