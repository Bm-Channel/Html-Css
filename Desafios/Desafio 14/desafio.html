<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Desafio</title>
    <style>

          body {
            font-family: Arial, Helvetica, sans-serif;
          }


           table {
           
            border-collapse: collapse;
            width: 45vw;
            text-align: center;

           }

           th {
            background-color: rgb(95, 95, 95);
            color: white;
           }

           th, td {
            border: 1px solid black;
            padding: 11px;
           }

           th.open {
            background-color: white;
            color: black;
           }

           td.try {
            background-color:rgb(95, 95, 95);
            color: white;
           }
    </style>

   
</head>
<body>
        <table>
            <thead>
                <tr>
                    <th scope="col" rowspan="2">Área</th>
                    <th scope="col" rowspan="2">Disciplinas</th>
                    <th scope="colgroup" colspan="2">Notas</th> 
                    <th scope="col" rowspan="2">Média</th>
                </tr>

                <tr> 
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <th class="open" rowspan="4" scope="rowgroup">Exatas</th>
                    <td>Matemática</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                
                <tr>
                    <td>Física</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>

                <tr>
                    <td>Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>

                <tr>
                    <td>Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>

                <tr>
                    <th colspan="4" scope="row">Média de Exatas</th>
                    <td class="try">0.0</td>
                </tr>

                <tr>
                    <th class="open" rowspan="2" scope="rowgroup">Humanas</th>
                    <td>História</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>

                <tr>
                    <td>Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>

                <tr>
                    <th scope="row" colspan="4">Média de Humanas</th>
                    <td class="try">0.0</td>
                </tr>
            </tbody>
        </table>
</body>
</html>
